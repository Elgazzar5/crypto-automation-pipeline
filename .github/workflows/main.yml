name: Run Crypto ETL Daily

on:
  schedule:
    # الكود ده معناه يشتغل أوتوماتيك كل يوم الساعة 12 بالليل بتوقيت جرينتش
    - cron: '0 0 * * *'
  workflow_dispatch: # الميزة دي بتخليك تقدر تشغله بإيدك في أي وقت للتجربة

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        pip install requests pandas sqlalchemy psycopg2-binary

    - name: Run ETL Script
      run: python extract.py

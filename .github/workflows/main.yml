name: Run Crypto ETL Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        pip install requests pandas sqlalchemy psycopg2-binary

    - name: Run ETL Script
      env:
        SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      run: python untitled21.py
    - name: Run ETL Script
      env:
        SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }} # هيروح يجيبها من الخزنة
      run: python extract.py






